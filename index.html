<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Chris F. Student Program Hub</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4fa}
#hub{border:0;width:100%;height:100%;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="hub" src="hub-source.html" title="Chris F. Student Program Hub"></iframe>
<script>
(function(){
  const hub=document.getElementById('hub');
  const watchedDocs=new WeakSet();

  function decodeHtml(s){
    let v=String(s==null?'':s);
    for(let i=0;i<6;i++){
      const t=document.createElement('textarea');
      t.innerHTML=v;
      const n=t.value;
      if(n===v) break;
      v=n;
    }
    return v;
  }

  function cleanHtml(s){
    let v=decodeHtml(s).trim();
    v=v.replace(/^\s*```(?:html)?\s*/i,'')
       .replace(/\s*```\s*$/,'')
       .trim();
    return v;
  }

  function htmlScore(s){
    const v=cleanHtml(s);
    if(v.length<25) return 0;
    let score=0;
    if(/<!doctype\s+html/i.test(v)) score+=10;
    if(/<html[\s>]/i.test(v)) score+=8;
    if(/<(?:head|body)[\s>]/i.test(v)) score+=5;
    if(/<(?:style|script)[\s>]/i.test(v)) score+=5;
    const tags=v.match(/<\/?[a-z][a-z0-9:-]*(?:\s[^<>]*?)?>/gi)||[];
    score+=Math.min(tags.length,10);
    if(/<\/(?:div|section|main|article|table|form|style|script|body|html)>/i.test(v)) score+=3;
    return score;
  }

  function looksLikeHtml(s){
    return htmlScore(s)>=5;
  }

  function asDocument(html){
    if(/<!doctype\s+html|<html[\s>]/i.test(html)) return html;
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>html,body{margin:0;min-height:100%;background:#fff}body{box-sizing:border-box}</style></head><body>'+html+'</body></html>';
  }

  function textOf(el){
    if(!el) return '';
    if(el.tagName==='TEXTAREA'||el.tagName==='INPUT') return el.value||'';
    return el.textContent||'';
  }

  function makeProgramFrame(html){
    const f=document.createElement('iframe');
    f.setAttribute('title','Chris Program');
    f.setAttribute('loading','eager');
    f.style.width='100%';
    f.style.minHeight='720px';
    f.style.height='78vh';
    f.style.border='0';
    f.style.display='block';
    f.style.background='#fff';
    f.style.borderRadius='12px';
    f.srcdoc=asDocument(html);
    f.addEventListener('load',()=>watchFrame(f));
    return f;
  }

  function renderElement(el){
    if(!el||el.nodeType!==1||el.tagName==='IFRAME') return false;
    if(el.dataset&&el.dataset.chrisRendered==='1') return false;

    const txt=textOf(el);
    if(!looksLikeHtml(txt)) return false;

    if(el.dataset) el.dataset.chrisRendered='1';
    const f=makeProgramFrame(cleanHtml(txt));
    try{ el.replaceWith(f); }catch(e){ return false; }
    return true;
  }

  function repairWholeDocument(doc){
    if(!doc||!doc.body) return false;
    const b=doc.body;
    const txt=textOf(b).trim();

    // A nested program sometimes opens as a page containing only literal HTML source.
    if((b.children.length<=4 || b.querySelector('pre,code,textarea')) && htmlScore(txt)>=8){
      const html=cleanHtml(txt);
      try{
        doc.open();
        doc.write(asDocument(html));
        doc.close();
        setTimeout(()=>watchDocument(doc),0);
        return true;
      }catch(e){}
    }
    return false;
  }

  function sweep(doc){
    if(!doc||!doc.body) return;

    if(repairWholeDocument(doc)) return;

    const strong='pre,code,textarea,[contenteditable="true"],.program-content,.program-body,.program-display,.program-runner,.runner,.content,.html-content,.code-content,[data-program],[data-html]';
    doc.querySelectorAll(strong).forEach(renderElement);

    doc.querySelectorAll('div,section,article,main').forEach(el=>{
      if(el.querySelector('iframe')) return;
      if(el.children.length>6) return;
      const txt=textOf(el);
      if(txt.length<40||txt.length>1000000) return;

      const inner=el.innerHTML||'';
      const encoded=/&(?:lt|gt|quot|#60|#62|amp);/i.test(inner);
      const literal=/<\/?[a-z][a-z0-9:-]*(?:\s|>)/i.test(txt);
      if((encoded||literal) && looksLikeHtml(txt)) renderElement(el);
    });

    // Programs may themselves be nested frames.
    doc.querySelectorAll('iframe').forEach(f=>{
      f.addEventListener('load',()=>watchFrame(f),{once:false});
      watchFrame(f);
    });
  }

  function watchFrame(frame){
    let d;
    try{ d=frame.contentDocument || (frame.contentWindow&&frame.contentWindow.document); }catch(e){ return; }
    if(d) watchDocument(d);
  }

  function watchDocument(doc){
    if(!doc||!doc.documentElement) return;

    const run=()=>{ try{sweep(doc);}catch(e){} };

    if(!watchedDocs.has(doc)){
      watchedDocs.add(doc);

      const observer=new MutationObserver(muts=>{
        for(const m of muts){
          if(m.type==='childList'){
            m.addedNodes.forEach(n=>{
              if(n.nodeType!==1) return;
              if(n.tagName==='IFRAME') watchFrame(n);
              renderElement(n);
              if(n.querySelectorAll){
                n.querySelectorAll('iframe').forEach(watchFrame);
                n.querySelectorAll('pre,code,textarea,[contenteditable="true"],.program-content,.program-body,.program-display,.program-runner,.runner,.content,.html-content,.code-content,[data-program],[data-html],div,section,article,main')
                  .forEach(renderElement);
              }
            });
          }else if(m.type==='characterData'){
            const p=m.target.parentElement;
            if(p) renderElement(p);
          }
        }
        setTimeout(run,0);
      });

      observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});

      ['click','change','input'].forEach(evt=>{
        doc.addEventListener(evt,()=>{
          [0,30,100,250,600,1200].forEach(ms=>setTimeout(run,ms));
        },true);
      });
    }

    run();
    [50,150,350,800,1600,3000].forEach(ms=>setTimeout(run,ms));
  }

  hub.addEventListener('load',()=>watchFrame(hub));
})();
</script>
</body>
</html>
