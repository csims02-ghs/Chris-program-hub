<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Chris F. Student Program Hub</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4fa}
#hub{border:0;width:100%;height:100%;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="hub" src="hub-source.html" title="Chris F. Student Program Hub"></iframe>
<script>
(function(){
  const hub=document.getElementById('hub');

  function decodeHtml(s){
    let v=String(s == null ? '' : s);
    for(let i=0;i<4;i++){
      const t=document.createElement('textarea');
      t.innerHTML=v;
      const next=t.value;
      if(next===v) break;
      v=next;
    }
    return v;
  }

  function cleanHtml(s){
    let v=decodeHtml(s).trim();
    v=v.replace(/^\s*```(?:html|HTML)?\s*/,'')
       .replace(/\s*```\s*$/,'')
       .trim();
    return v;
  }

  function looksLikeHtml(s){
    if(!s) return false;
    const v=cleanHtml(s);
    if(v.length < 40) return false;

    const hasDocument=/(?:<!doctype\s+html|<html[\s>]|<head[\s>]|<body[\s>])/i.test(v);
    const tagMatches=v.match(/<(?:div|section|article|main|header|footer|nav|style|script|button|select|option|input|label|table|thead|tbody|tr|td|th|form|canvas|svg|img|h[1-6]|p|span|ul|ol|li|iframe)\b/gi) || [];
    const closing=/<\/(?:div|section|article|main|header|footer|nav|style|script|button|select|label|table|thead|tbody|tr|td|th|form|h[1-6]|p|span|ul|ol|li|iframe)>/i.test(v);

    return hasDocument || (tagMatches.length >= 2 && (closing || /<style\b|<script\b/i.test(v)));
  }

  function asDocument(html){
    if(/(?:<!doctype\s+html|<html[\s>])/i.test(html)) return html;
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>html,body{margin:0;min-height:100%;background:#fff}body{box-sizing:border-box}</style></head><body>'+html+'</body></html>';
  }

  function rawText(el){
    if(!el) return '';
    if(el.tagName==='TEXTAREA' || el.tagName==='INPUT') return el.value || '';
    return el.textContent || '';
  }

  function renderRawHtmlElement(el){
    if(!el || el.nodeType!==1) return false;
    if(el.dataset && el.dataset.chrisRendered==='1') return false;
    if(el.tagName==='IFRAME') return false;

    const txt=rawText(el);
    if(!looksLikeHtml(txt)) return false;

    const html=cleanHtml(txt);
    const frame=document.createElement('iframe');
    frame.setAttribute('title','Chris Program');
    frame.setAttribute('loading','eager');
    frame.style.width='100%';
    frame.style.minHeight='720px';
    frame.style.height='78vh';
    frame.style.border='0';
    frame.style.display='block';
    frame.style.background='#fff';
    frame.style.borderRadius='12px';
    frame.srcdoc=asDocument(html);

    if(el.dataset) el.dataset.chrisRendered='1';
    el.replaceWith(frame);
    return true;
  }

  function sweep(doc){
    if(!doc || !doc.body) return;

    const strong='pre,code,textarea,.program-content,.program-body,.program-display,.program-runner,.runner,.content,[data-program],[data-html]';
    doc.querySelectorAll(strong).forEach(renderRawHtmlElement);

    doc.querySelectorAll('div,section,article,main').forEach(el=>{
      if(el.querySelector('iframe')) return;
      if(el.children.length>4) return;

      const txt=rawText(el);
      if(txt.length<80 || txt.length>500000) return;

      const encoded=/&(?:lt|gt|quot|amp);/i.test(el.innerHTML || '');
      const visibleTags=/<(?:!doctype|html|head|body|div|style|script|button|select|input|table|section|main)\b/i.test(txt);

      if(encoded || visibleTags) renderRawHtmlElement(el);
    });
  }

  function install(){
    let doc;
    try{ doc=hub.contentDocument || hub.contentWindow.document; }catch(e){ return; }

    const runSweep=()=>{
      try{sweep(doc);}catch(e){}
    };

    runSweep();
    [40,120,300,700,1400].forEach(ms=>setTimeout(runSweep,ms));

    const observer=new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type==='childList'){
          m.addedNodes.forEach(n=>{
            if(n.nodeType===1){
              renderRawHtmlElement(n);
              if(n.querySelectorAll){
                n.querySelectorAll('pre,code,textarea,.program-content,.program-body,.program-display,.program-runner,.runner,.content,[data-program],[data-html],div,section,article,main')
                 .forEach(renderRawHtmlElement);
              }
            }
          });
        }else if(m.type==='characterData'){
          const p=m.target.parentElement;
          if(p) renderRawHtmlElement(p);
        }
      }
    });

    observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});

    doc.addEventListener('click',()=>{
      [0,40,120,300,700].forEach(ms=>setTimeout(runSweep,ms));
    },true);

    doc.addEventListener('change',()=>{
      [0,60,180,500].forEach(ms=>setTimeout(runSweep,ms));
    },true);

    setInterval(runSweep,1000);
  }

  hub.addEventListener('load',install);
})();
</script>
</body>
</html>
