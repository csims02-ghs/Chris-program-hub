<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Chris F. Student Program Hub</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4fa}
#hub{border:0;width:100%;height:100%;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="hub" src="hub-source.html" title="Chris F. Student Program Hub"></iframe>
<script>
(function(){
  const hub=document.getElementById('hub');

  function decodeHtml(s){
    const t=document.createElement('textarea');
    t.innerHTML=s;
    return t.value;
  }

  function looksLikeFullHtml(s){
    if(!s) return false;
    const v=decodeHtml(String(s)).trim();
    return /^(?:```(?:html)?\s*)?(?:<!doctype\s+html|<html[\s>]|<head[\s>]|<body[\s>])/i.test(v) &&
           /<\/(?:html|body)>/i.test(v);
  }

  function cleanCodeFence(s){
    let v=decodeHtml(String(s)).trim();
    v=v.replace(/^```(?:html)?\s*/i,'').replace(/\s*```$/,'').trim();
    return v;
  }

  function renderRawHtmlElement(el){
    if(!el || el.dataset && el.dataset.chrisRendered==='1') return false;
    const txt=(el.tagName==='TEXTAREA' || el.tagName==='INPUT') ? el.value : el.textContent;
    if(!looksLikeFullHtml(txt)) return false;

    const html=cleanCodeFence(txt);
    const frame=document.createElement('iframe');
    frame.setAttribute('title','Chris Program');
    frame.setAttribute('loading','eager');
    frame.style.width='100%';
    frame.style.minHeight='720px';
    frame.style.height='78vh';
    frame.style.border='0';
    frame.style.display='block';
    frame.style.background='#fff';
    frame.style.borderRadius='12px';
    frame.srcdoc=html;

    if(el.dataset) el.dataset.chrisRendered='1';
    el.replaceWith(frame);
    return true;
  }

  function sweep(doc){
    if(!doc || !doc.body) return;
    const selector='pre,code,textarea,.program-content,.program-body,.program-display,.runner,.content,[data-program],[data-html]';
    doc.querySelectorAll(selector).forEach(renderRawHtmlElement);

    // Fallback for raw HTML placed in ordinary containers.
    doc.querySelectorAll('div,section,article,main').forEach(el=>{
      if(el.children.length>8) return;
      const txt=el.textContent || '';
      if(txt.length<150 || txt.length>300000) return;
      renderRawHtmlElement(el);
    });
  }

  function install(){
    let doc;
    try{ doc=hub.contentDocument || hub.contentWindow.document; }catch(e){ return; }
    sweep(doc);

    const observer=new MutationObserver(muts=>{
      for(const m of muts){
        if(m.type==='childList'){
          m.addedNodes.forEach(n=>{
            if(n.nodeType===1){
              renderRawHtmlElement(n);
              if(n.querySelectorAll) {
                n.querySelectorAll('pre,code,textarea,div,section,article,main').forEach(renderRawHtmlElement);
              }
            }
          });
        } else if(m.type==='characterData'){
          const p=m.target.parentElement;
          if(p) renderRawHtmlElement(p);
        }
      }
    });
    observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});

    // Catch programs loaded by click handlers/timeouts.
    setInterval(()=>sweep(doc),1200);
  }

  hub.addEventListener('load',install);
})();
</script>
</body>
</html>
